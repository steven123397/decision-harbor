[alembic]
script_location = %(here)s
sqlalchemy.url = postgresql+psycopg://analytics_admin:admin_pass@db:5432/analytics

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
