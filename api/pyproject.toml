[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionharbor-api"
version = "0.1.0"
description = "DecisionHarbor 受治理查询 API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlglot>=26,<28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要已就绪的双数据库环境",
]
