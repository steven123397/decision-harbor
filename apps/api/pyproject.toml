[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionharbor-api"
version = "0.1.0"
description = "Governed SQL query API for DecisionHarbor"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2,<3",
  "sqlglot>=27,<28",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "integration: requires the Compose PostgreSQL databases and runtime roles",
]

[tool.setuptools.packages.find]
where = ["src"]
