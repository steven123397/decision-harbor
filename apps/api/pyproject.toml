[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionharbor-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.2",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.51",
  "sqlglot==29.0.1",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
markers = [
  "integration: requires the Compose PostgreSQL and API services",
  "worker: requires the Worker credential environment (platform task and analytics reader)",
]
