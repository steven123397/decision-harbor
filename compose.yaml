services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: harbor_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-decisionharbor_admin_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql

  init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "decisionharbor.bootstrap"]
    environment:
      ADMIN_DATABASE_URL: postgresql://harbor_admin:${POSTGRES_ADMIN_PASSWORD:-decisionharbor_admin_local}@postgres:5432/postgres
      PLATFORM_APP_PASSWORD: ${PLATFORM_APP_PASSWORD:-decisionharbor_platform_local}
      PLATFORM_WORKER_PASSWORD: ${PLATFORM_WORKER_PASSWORD:-decisionharbor_worker_local}
      ANALYTICS_READER_PASSWORD: ${ANALYTICS_READER_PASSWORD:-decisionharbor_analytics_local}
      ANALYTICS_READINESS_PASSWORD: ${ANALYTICS_READINESS_PASSWORD:-decisionharbor_readiness_local}
      DATASET_ROOT: /app/datasets/sales-analytics-v1
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_app:${PLATFORM_APP_PASSWORD:-decisionharbor_platform_local}@postgres:5432/platform
      ANALYTICS_READINESS_DATABASE_URL: postgresql+psycopg://analytics_readiness:${ANALYTICS_READINESS_PASSWORD:-decisionharbor_readiness_local}@postgres:5432/analytics
      DATASET_ROOT: /app/datasets/sales-analytics-v1
      QUERY_STATEMENT_TIMEOUT_MS: ${QUERY_STATEMENT_TIMEOUT_MS:-5000}
      QUERY_MAX_ROWS: ${QUERY_MAX_ROWS:-500}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "decisionharbor.worker"]
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_worker:${PLATFORM_WORKER_PASSWORD:-decisionharbor_worker_local}@postgres:5432/platform
      ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics_reader:${ANALYTICS_READER_PASSWORD:-decisionharbor_analytics_local}@postgres:5432/analytics
      QUERY_MAX_CONCURRENCY: ${QUERY_MAX_CONCURRENCY:-4}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-15000}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-3000}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-250}
      WORKER_MAX_EXECUTION_ATTEMPTS: ${WORKER_MAX_EXECUTION_ATTEMPTS:-3}
      WORKER_CLEANUP_INTERVAL_MS: ${WORKER_CLEANUP_INTERVAL_MS:-60000}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-5173}:4173"

  api-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pytest", "-q", "tests/unit", "tests/integration"]
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_app:${PLATFORM_APP_PASSWORD:-decisionharbor_platform_local}@postgres:5432/platform
      ANALYTICS_READINESS_DATABASE_URL: postgresql+psycopg://analytics_readiness:${ANALYTICS_READINESS_PASSWORD:-decisionharbor_readiness_local}@postgres:5432/analytics
      TEST_ADMIN_DATABASE_URL: postgresql://harbor_admin:${POSTGRES_ADMIN_PASSWORD:-decisionharbor_admin_local}@postgres:5432/postgres
      API_BASE_URL: http://api:8000
      DATASET_ROOT: /app/datasets/sales-analytics-v1
      QUERY_STATEMENT_TIMEOUT_MS: ${QUERY_STATEMENT_TIMEOUT_MS:-5000}
      QUERY_MAX_ROWS: ${QUERY_MAX_ROWS:-500}
      NO_PROXY: api,postgres,localhost,127.0.0.1,::1
      no_proxy: api,postgres,localhost,127.0.0.1,::1
    depends_on:
      api:
        condition: service_healthy

  worker-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pytest", "-q", "tests/worker"]
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_worker:${PLATFORM_WORKER_PASSWORD:-decisionharbor_worker_local}@postgres:5432/platform
      ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics_reader:${ANALYTICS_READER_PASSWORD:-decisionharbor_analytics_local}@postgres:5432/analytics
      WORKER_URL: http://worker:8001
      DATASET_ROOT: /app/datasets/sales-analytics-v1
      NO_PROXY: worker,postgres,localhost,127.0.0.1,::1
      no_proxy: worker,postgres,localhost,127.0.0.1,::1
    depends_on:
      worker:
        condition: service_healthy

  web-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: test
    command: ["npm", "run", "test:run"]

  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: test
    command: ["npm", "run", "test:e2e"]
    environment:
      PLAYWRIGHT_BASE_URL: http://web:4173
      NO_PROXY: web,api,postgres,localhost,127.0.0.1,::1
      no_proxy: web,api,postgres,localhost,127.0.0.1,::1
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
