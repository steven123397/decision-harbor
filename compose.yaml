services:
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_app:platform@postgres:5432/platform
      ANALYTICS_OWNER_DATABASE_URL: postgresql+psycopg://analytics_owner:owner@postgres:5432/analytics
      ANALYTICS_READER_DATABASE_URL: postgresql+psycopg://analytics_reader:reader@postgres:5432/analytics
      DATASET_DIR: /datasets/sales-analytics-v1
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 20

  api-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: api/Dockerfile
    command: pytest -q
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform_app:platform@postgres:5432/platform
      ANALYTICS_OWNER_DATABASE_URL: postgresql+psycopg://analytics_owner:owner@postgres:5432/analytics
      ANALYTICS_READER_DATABASE_URL: postgresql+psycopg://analytics_reader:reader@postgres:5432/analytics
      DATASET_DIR: /datasets/sales-analytics-v1
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: web/Dockerfile.test
    depends_on:
      web:
        condition: service_healthy

  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: web/Dockerfile.e2e
    environment:
      PLAYWRIGHT_BASE_URL: http://web
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
