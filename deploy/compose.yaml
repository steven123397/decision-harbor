# 项目名从 .env 的 COMPOSE_PROJECT_NAME 读取（默认 decision-harbor），
# 并行工作区靠它获得隔离的网络/卷/容器命名空间。
name: ${COMPOSE_PROJECT_NAME:-decision-harbor}

services:
  db:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      # PostgreSQL 18+ 要求数据卷挂在 /var/lib/postgresql（版本子目录由镜像管理）。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 一次性初始化：迁移 + seed 用高权限身份，跑完即退出。
  # API 服务容器自始至终不接触 owner 凭据。
  init:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["python", "-m", "app.bootstrap"]
    environment:
      PLATFORM_OWNER_URL: postgresql+psycopg://platform_owner:platform_owner@db:5432/platform
      ANALYTICS_OWNER_DSN: postgresql://analytics_owner:analytics_owner@db:5432/analytics
      DATASET_DIR: /srv/datasets/sales-analytics-v1
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      # 运行时身份只有低权限两条：审计读写 + 只读执行。
      PLATFORM_APP_URL: postgresql+psycopg://platform_app:platform_app@db:5432/platform
      ANALYTICS_READONLY_DSN: postgresql://analytics_readonly:analytics_readonly@db:5432/analytics
      DATASET_DIR: /srv/datasets/sales-analytics-v1
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8081}:8000"
    restart: unless-stopped

  # 后台执行组件 ×2：SKIP LOCKED 协同消费同一队列，租约过期互相接管（ADR-0017）。
  # 与 API 同镜像不同入口（ADR-0016）；全局并发闸门与自动重试见 #11。
  worker-1: &worker
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: &worker-env
      PLATFORM_APP_URL: postgresql+psycopg://platform_app:platform_app@db:5432/platform
      ANALYTICS_READONLY_DSN: postgresql://analytics_readonly:analytics_readonly@db:5432/analytics
      WORKER_ID: worker-1
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # worker 无 HTTP 端口：健康 = platform 库里的心跳标记仍新鲜。
    healthcheck: &worker-healthcheck
      test: ["CMD", "python", "-m", "app.worker_healthcheck", "worker-1", "60"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker-2:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-2
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "app.worker_healthcheck", "worker-2", "60"]

  web:
    build:
      context: ../web
      args:
        API_BASE_URL: ""
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---- test profile：只在 make test 时构建运行 ----

  # 集成测试需要 owner 身份做负向用例，跑在独立容器而非 api 服务进程。
  api-test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["pytest", "tests/integration", "-q"]
    environment:
      ANALYTICS_OWNER_DSN: postgresql://analytics_owner:analytics_owner@db:5432/analytics
      ANALYTICS_READONLY_DSN: postgresql://analytics_readonly:analytics_readonly@db:5432/analytics
      PLATFORM_APP_URL: postgresql+psycopg://platform_app:platform_app@db:5432/platform
      DATASET_DIR: /srv/datasets/sales-analytics-v1
    depends_on:
      api:
        condition: service_healthy

  # Web 单元测试在带 Node 工具链的测试镜像里执行，不进生产 Nginx 容器。
  web-test:
    profiles: ["test"]
    build:
      context: ../web
      target: test

volumes:
  pgdata:
